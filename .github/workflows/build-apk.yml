name: Build Standalone Teleflix APK
# Automated APK build & release workflow

on:
  push:
    branches: [ master, main, standalone-app ]
  pull_request:
    branches: [ master, main, standalone-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted App Version: ${VERSION}"

      - name: Build Multi-Architecture Release APKs
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename and Package APKs
        run: |
          cd app/build/outputs/apk/release/
          VERSION="${{ steps.app_version.outputs.version }}"
          for f in app-*-release.apk; do
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed -e 's/app-//' -e 's/-release.apk//')
            mv "$f" "Teleflix-v${VERSION}-${arch}.apk"
          done
          if [ -f "Teleflix-v${VERSION}-universal.apk" ]; then
            cp "Teleflix-v${VERSION}-universal.apk" "Teleflix-v${VERSION}.apk"
          fi
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Teleflix-Release-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256_checksums.txt

      - name: Get Short SHA
        id: slug
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        id: notes
        run: |
          cd app/build/outputs/apk/release/
          CHECKSUM_TABLE="| Architecture | APK File | Size | SHA-256 Checksum |"$'\n'"| :--- | :--- | :--- | :--- |"
          for f in *.apk; do
            [ -f "$f" ] || continue
            sum=$(sha256sum "$f" | awk '{print $1}')
            size=$(ls -lh "$f" | awk '{print $5}')
            case "$f" in
              *"arm64-v8a"*) desc="**ARM64** (Modern Phones & Tablets)";;
              *"armeabi-v7a"*) desc="**ARMv7** (Older 32-bit Phones & TVs)";;
              *"x86_64"*) desc="**x86_64** (64-bit Emulators & PCs)";;
              *"x86"*) desc="**x86** (32-bit Emulators)";;
              *"universal"*) desc="**Universal** (All-in-one bundle)";;
              "Teleflix-v${{ steps.app_version.outputs.version }}.apk") desc="**Recommended** (Universal Package)";;
              *) desc="Teleflix APK";;
            esac
            CHECKSUM_TABLE="$CHECKSUM_TABLE"$'\n'"| $desc | \`$f\` | $size | \`$sum\` |"
          done

          # Export multiline output to GITHUB_OUTPUT
          echo "checksum_table<<EOF" >> $GITHUB_OUTPUT
          echo "$CHECKSUM_TABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Multi-Arch APKs
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "Teleflix v${{ steps.app_version.outputs.version }}"
          body: |
            ## 📱 Teleflix v${{ steps.app_version.outputs.version }} - Production Release (Multi-Architecture)

            **Commit:** `${{ steps.slug.outputs.sha }}`
            **Branch:** `master`

            ### 🚀 Architecture-Specific Downloads & Checksums
            ${{ steps.notes.outputs.checksum_table }}

            ### 💡 Which APK should I install?
            - **`Teleflix-v${{ steps.app_version.outputs.version }}.apk`**: Recommended universal bundle compatible with any Android device (~41 MB).
            - **`Teleflix-v${{ steps.app_version.outputs.version }}-arm64-v8a.apk`**: Recommended for almost all modern Android phones & tablets (~15 MB).
            - **`Teleflix-v${{ steps.app_version.outputs.version }}-armeabi-v7a.apk`**: For older 32-bit devices and Android TV boxes (~13 MB).
            - **`Teleflix-v${{ steps.app_version.outputs.version }}-x86_64.apk` / `Teleflix-v${{ steps.app_version.outputs.version }}-x86.apk`**: For Android emulators & Chromebooks (~14 MB).

            ### Key Features
            - **Restored v1.0.6 Rock-Solid Streaming & Service Engine:** Full restoration of proven v1.0.6 streaming proxy and background service lifecycle, permanently resolving the issue where subsequent movies failed to play after player disconnect
            - **Zero TDLib Network Suspension:** Telegram MTProto connection remains continuously active and ready, eliminating connection drops, 30s timeouts, and offline stalls when switching between items or returning from external players
            - **Multi-Track Concurrent Seeking (Capacity 3):** Preserved concurrent stream handling up to 3 parallel tracks without mutual cancellation or ping-pong abort loops during rapid scrubbing
            - **Ultra-Small Multi-Architecture Release APKs:** ProGuard/R8 code minification, aggressive resource shrinking, and per-ABI splits delivering ultra-compact APKs (~11-12 MB) saving up to 70% download size
            - **Dual-Mode Catalogs:** Switch seamlessly between Cinemeta movies/series & Monitored Telegram Channels
            - **Live Video Thumbnails & Posters:** Widescreen 16:9 thumbnails for video items & real Telegram chat titles
            - **Real-Time Split & ZIP Archive Streaming:** Automatic grouping of split archives (`.001/.002`, `.part1`, `.zip`) with on-the-fly streaming directly from Telegram cloud
            - **Parallel Downloading:** Multi-task concurrent downloads with automatic split-part pre-fetching
            - **Built-in & External Player Integration:** Smooth playback in ExoPlayer, VLC, MX Player, and MPV
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256_checksums.txt
          draft: false
          prerelease: false
          make_latest: true

